# Dependabot opens update PRs for the NuGet packages and the GitHub Actions the workflows use
# (they are pinned to commit SHAs, so it updates the SHA and the version comment together).
# Each PR still goes through CI and review like any other. The bundled front-end libraries in
# MDGlint.Desktop/Assets/vendor/ aren't covered; they are checked by hand before each release
# (docs/roadmap.md, "Bundled library updates").
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /MDGlint.Core
      - /MDGlint.Desktop
      - /MDGlint.Core.Tests
      - /MDGlint.Desktop.Tests
      - /MDGlint.EndToEnd.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Each group is one PR covering every project, so a package several projects use isn't
      # split across PRs. Major updates stay apart, as they more often need code changes.
      nuget-minor-and-patch:
        update-types: [minor, patch]
      nuget-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
