name: Bug report
description: Something renders wrong, crashes, or does not work as described.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, do not use this form; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample Markdown
      description: The smallest Markdown that shows the problem. Paste it here or attach the file.
      render: markdown
  - type: input
    id: version
    attributes:
      label: MDGlint version
      description: From Settings > Apps > Installed apps, or the release you downloaded.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
  - type: textarea
    id: startup-error
    attributes:
      label: Startup error log
      description: If MDGlint showed an error, paste the contents of `%LOCALAPPDATA%\MDGlint\startup-error.txt`. Replace your user name in any paths first; this issue is public.
      render: text
